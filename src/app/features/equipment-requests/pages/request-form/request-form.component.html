<p-dialog
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [header]="dialogTitle()"
  [closable]="!isSaving()"
  [style]="{ width: '720px', maxWidth: '95vw' }"
  styleClass="request-dialog"
>
  @if (statusNotice()) {
    <div class="status-notice" [class]="'notice-' + currentStatus().toLowerCase()">
      <i class="pi pi-info-circle notice-icon" aria-hidden="true"></i>
      <span>{{ statusNotice() }}</span>
    </div>
  }

  <form [formGroup]="requestForm" class="request-dialog-form" novalidate>
    <div class="form-grid">
      <!-- Request Number -->
      <div class="field-col">
        <label for="form-requestNumber" class="field-label">
          {{ 'form.requestNumber' | translate }}
          <span class="required-star">*</span>
        </label>
        <input
          pInputText
          id="form-requestNumber"
          type="text"
          formControlName="requestNumber"
          placeholder="EQ-1006"
          class="w-full font-mono"
        />
        <small class="field-help">{{ 'form.requestNumberHelp' | translate }}</small>
        <app-form-error
          [control]="requestForm.controls.requestNumber"
          [fieldName]="'form.requestNumber' | translate"
        />
      </div>

      <!-- Employee Select -->
      <div class="field-col">
        <label for="form-employeeId" class="field-label">
          {{ 'form.employeeName' | translate }}
          <span class="required-star">*</span>
        </label>
        <p-select
          id="form-employeeId"
          formControlName="employeeId"
          [options]="employeeOptions()"
          optionLabel="label"
          optionValue="value"
          [filter]="true"
          [placeholder]="'form.selectEmployee' | translate"
          (onChange)="onEmployeeSelect($event.value)"
          styleClass="w-full"
        />
        <app-form-error
          [control]="requestForm.controls.employeeId"
          [fieldName]="'form.employeeName' | translate"
        />
      </div>

      <!-- Department -->
      <div class="field-col">
        <label for="form-departmentId" class="field-label">
          {{ 'form.department' | translate }}
          <span class="required-star">*</span>
        </label>
        <p-select
          id="form-departmentId"
          formControlName="departmentId"
          [options]="departmentOptions()"
          optionLabel="label"
          optionValue="value"
          [filter]="true"
          [placeholder]="'form.selectDepartment' | translate"
          styleClass="w-full"
        />
        <app-form-error
          [control]="requestForm.controls.departmentId"
          [fieldName]="'form.department' | translate"
        />
      </div>

      <!-- Equipment Item -->
      <div class="field-col">
        <label for="form-item" class="field-label">
          {{ 'form.item' | translate }}
          <span class="required-star">*</span>
        </label>
        <p-select
          id="form-item"
          formControlName="item"
          [options]="itemOptions()"
          optionLabel="label"
          optionValue="value"
          [placeholder]="'form.selectItem' | translate"
          styleClass="w-full"
        />
        <app-form-error
          [control]="requestForm.controls.item"
          [fieldName]="'form.item' | translate"
        />
      </div>

      <!-- Quantity -->
      <div class="field-col">
        <label for="form-quantity" class="field-label">
          {{ 'form.quantity' | translate }}
          <span class="required-star">*</span>
        </label>
        <input
          pInputText
          id="form-quantity"
          type="number"
          min="1"
          max="10"
          step="1"
          formControlName="quantity"
          class="w-full font-mono"
        />
        <app-form-error
          [control]="requestForm.controls.quantity"
          [fieldName]="'form.quantity' | translate"
        />
      </div>

      <!-- Estimated Cost -->
      <div class="field-col">
        <label for="form-estimatedCost" class="field-label">
          {{ 'form.estimatedCost' | translate }}
          <span class="required-star">*</span>
        </label>
        <input
          pInputText
          id="form-estimatedCost"
          type="number"
          step="0.01"
          min="0.01"
          formControlName="estimatedCost"
          class="w-full font-mono"
          dir="ltr"
        />
        <app-form-error
          [control]="requestForm.controls.estimatedCost"
          [fieldName]="'form.estimatedCost' | translate"
        />
      </div>

      <!-- Needed On Date -->
      <div class="field-col">
        <label for="form-neededOn" class="field-label">
          {{ 'form.neededOn' | translate }}
          <span class="required-star">*</span>
        </label>
        <input
          pInputText
          id="form-neededOn"
          type="date"
          [min]="minDateString"
          formControlName="neededOn"
          class="w-full font-mono"
        />
        <app-form-error
          [control]="requestForm.controls.neededOn"
          [fieldName]="'form.neededOn' | translate"
        />
      </div>

      <!-- Reason (Full width) -->
      <div class="field-col span-2">
        <label for="form-reason" class="field-label">
          {{ 'form.reason' | translate }}
          <span class="optional-hint">({{ 'form.reasonPlaceholder' | translate }})</span>
        </label>
        <textarea
          pTextarea
          id="form-reason"
          formControlName="reason"
          rows="3"
          maxlength="250"
          [placeholder]="'form.reasonPlaceholder' | translate"
          class="w-full"
        ></textarea>
        <div class="char-count">
          {{ requestForm.controls.reason.value.length || 0 }}/250
        </div>
        <app-form-error
          [control]="requestForm.controls.reason"
          [fieldName]="'form.reason' | translate"
        />
      </div>
    </div>

    <!-- Actions Footer -->
    <div class="dialog-actions-bar">
      <p-button
        type="button"
        [label]="'form.cancel' | translate"
        icon="pi pi-times"
        severity="secondary"
        [outlined]="true"
        (onClick)="onCancel()"
        [disabled]="isSaving()"
      />

      <!-- Draft or Create Mode Actions -->
      @if (isAddMode() || currentStatus() === 'Draft') {
        <p-button
          type="button"
          [label]="'form.saveDraft' | translate"
          icon="pi pi-save"
          severity="secondary"
          (onClick)="saveDraft()"
          [loading]="isSaving() && targetStatus() === 'Draft'"
          [disabled]="isSaving() || isReadOnly()"
        />

        <p-button
          type="button"
          [label]="'form.submitRequest' | translate"
          icon="pi pi-send"
          (onClick)="submitRequest()"
          [loading]="isSaving() && targetStatus() === 'Submitted'"
          [disabled]="isSaving() || isReadOnly()"
        />
      }

      <!-- Submitted Mode Action -->
      @else if (currentStatus() === 'Submitted') {
        <p-button
          type="button"
          [label]="'form.submitRequest' | translate"
          icon="pi pi-check"
          (onClick)="submitRequest()"
          [loading]="isSaving() && targetStatus() === 'Submitted'"
          [disabled]="isSaving() || isReadOnly()"
        />
      }

      <!-- Approved Mode Actions -->
      @else if (currentStatus() === 'Approved') {
        <p-button
          type="button"
          [label]="'form.saveDraft' | translate"
          icon="pi pi-save"
          severity="secondary"
          (onClick)="processSave('Approved')"
          [loading]="isSaving() && targetStatus() === 'Approved'"
          [disabled]="isSaving() || isReadOnly()"
        />

        <p-button
          type="button"
          [label]="'form.markAsDelivered' | translate"
          icon="pi pi-box"
          severity="success"
          (onClick)="markAsDelivered()"
          [loading]="isSaving() && targetStatus() === 'Delivered'"
          [disabled]="isSaving() || isReadOnly()"
        />
      }
    </div>
  </form>
</p-dialog>
