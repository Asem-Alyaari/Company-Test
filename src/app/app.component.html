<p-toast position="top-right" />
<p-confirmDialog />

@if (authService.isAuthenticated()) {
  <app-sidebar />
}

<div class="app-layout">
  <!-- Top App Navigation hosting Language Switcher & Auth Links -->
  <header class="app-topbar">
    <div class="topbar-inner">
      <div class="topbar-start">
        @if (authService.isAuthenticated()) {
          <p-button
            icon="pi pi-bars"
            [rounded]="true"
            [text]="true"
            size="small"
            (onClick)="layoutService.toggleSidebar()"
            [title]="'nav.toggleSidebar' | translate"
            [ariaLabel]="'nav.toggleSidebar' | translate"
            styleClass="sidebar-toggle-btn"
          />
        }

        <a routerLink="/equipment-requests" class="app-brand" title="Home">
          <i class="pi pi-box brand-icon" aria-hidden="true"></i>
          <span class="brand-name">{{ 'app.title' | translate }}</span>
        </a>
      </div>

      <div class="topbar-actions">
        <!-- Theme Switcher Button -->
        <p-button
          [icon]="themeService.isDarkMode() ? 'pi pi-sun' : 'pi pi-moon'"
          [rounded]="true"
          [text]="true"
          severity="secondary"
          size="small"
          (onClick)="toggleTheme()"
          [title]="(themeService.isDarkMode() ? 'app.lightMode' : 'app.darkMode') | translate"
          [ariaLabel]="(themeService.isDarkMode() ? 'app.lightMode' : 'app.darkMode') | translate"
          styleClass="theme-switch-btn"
        />

        <!-- Language Switcher Button -->
        <p-button
          [label]="'app.switchLanguage' | translate"
          icon="pi pi-globe"
          severity="secondary"
          [outlined]="true"
          size="small"
          (onClick)="toggleLanguage()"
          [ariaLabel]="'Switch language to ' + ('app.switchLanguage' | translate)"
          styleClass="lang-switch-btn"
        />

        <!-- Authentication Indicator & Navigation to Login -->
        @if (authService.isAuthenticated()) {
          <div class="user-chip">
            <i class="pi pi-user user-chip-icon" aria-hidden="true"></i>
            <span class="user-chip-name">{{ authService.currentUser()?.name }}</span>
          </div>

          <p-button
            icon="pi pi-sign-out"
            severity="danger"
            [text]="true"
            size="small"
            (onClick)="logout()"
            [title]="'auth.logout' | translate"
            [ariaLabel]="'auth.logout' | translate"
          />
        } @else {
          <p-button
            [label]="'auth.signIn' | translate"
            icon="pi pi-sign-in"
            severity="secondary"
            size="small"
            routerLink="/auth/login"
          />
        }
      </div>
    </div>
  </header>

  <!-- Router Outlet for lazy-loaded feature components -->
  <main class="app-content">
    <router-outlet />
  </main>
</div>
